name: 기능 오류 리포트
description: 앱 동작, 저장, 배포, 화면 오류를 기록합니다.
title: "[Bug] "
labels: ["bug", "pilot-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        파일럿 테스트 중 발견한 기능 오류를 기록해 주세요. 가능하면 화면, 재현 순서, 사용 기기를 함께 남겨 주세요.
  - type: input
    id: screen
    attributes:
      label: 발생 화면
      description: 오류가 발생한 화면 또는 경로를 적어 주세요.
      placeholder: "예: /?view=check, 교육생 R2 AI 답변 검토 화면, 강사용 대시보드"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 높음 - 교육 진행이 어렵다
        - 중간 - 우회 가능하지만 운영에 지장이 있다
        - 낮음 - 불편하지만 운영은 가능하다
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 어떤 문제가 발생했는지 적어 주세요.
      placeholder: "예: 저장 완료 메시지는 보이지만 Google Sheets에 행이 생성되지 않습니다."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 같은 문제를 다시 확인할 수 있도록 순서대로 적어 주세요.
      placeholder: |
        1. 교육생 화면 접속
        2. Session 1 → R2 진행
        3. 최종본 저장하기 클릭
        4. 저장 완료 메시지 확인
        5. Google Sheets에는 저장되지 않음
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 사용 기기 / 브라우저
      placeholder: "예: Android Chrome, iPad Safari, Windows Chrome"
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: "예: 저장 완료 후 Responses 시트에 행이 생성되어야 합니다."
  - type: textarea
    id: notes
    attributes:
      label: 추가 메모 / 캡처
      placeholder: "스크린샷, 로그, 테스트 시간 등을 적어 주세요."
